name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"
  HF_HOME: ${{ github.workspace }}/.cache/hf

jobs:
  backend:
    name: Backend (ruff, mypy, import-linter, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: cd backend && uv sync --locked --extra dev --extra redis
      - name: Synthetic data is reproducible
        run: make data && git diff --exit-code -- data/raw
      - name: requirements.txt matches uv.lock
        run: make requirements && git diff --exit-code -- backend/requirements.txt
      - name: Lint
        run: |
          cd backend
          uv run ruff check src tests ../scripts
          uv run ruff format --check src tests ../scripts
          uv run lint-imports
      - name: Type check
        run: cd backend && uv run mypy src ../scripts/generate_synthetic_data.py
      - name: Test with coverage gate
        run: cd backend && uv run pytest

  frontend:
    name: Frontend (tsc, eslint, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Bundle budget
        run: pnpm size
      - name: Install Chromium
        run: PLAYWRIGHT_BROWSERS_PATH=0 pnpm exec playwright install --with-deps chromium
      - name: Storybook build with axe and play functions
        run: pnpm test-storybook

  e2e:
    name: E2E (compose, Playwright, Lighthouse)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLM_PROVIDER: extractive
      RATE_LIMIT_ENABLED: "false" # one client runs every test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile
      - name: Install Chromium
        run: cd frontend && PLAYWRIGHT_BROWSERS_PATH=0 pnpm exec playwright install --with-deps chromium
      - name: Start without an API key
        run: make docker-up
      - name: Playwright and axe
        run: cd frontend && E2E_BASE_URL=http://localhost:8080 pnpm e2e
      - name: The redis profile switches Redis on
        run: |
          make docker-up-redis
          curl -fsS http://localhost:8080/api/ready | jq -e '.flags.cache_backend == "redis" and .cache.ok'
      - name: Lighthouse CI
        env:
          LIGHTHOUSE_BASE_URL: http://127.0.0.1:8080
          # GitHub's Ubuntu runners forbid the user namespaces Chromium's sandbox needs.
          LIGHTHOUSE_CHROME_FLAGS: "--headless=new --no-sandbox"
        run: make lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse
          path: frontend/.lighthouseci/reports
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Stop
        if: always()
        run: docker compose --profile redis down --volumes

  images:
    name: Images (Trivy, SBOM)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose build
      - name: List high and critical findings
        run: bash scripts/image_scan.sh report
      - name: Fail on high or critical outside docs/09 section 8.1
        run: bash scripts/image_scan.sh scan
      - name: CycloneDX SBOM
        if: always()
        run: make sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom
          path: reports/sbom-*.cdx.json
          if-no-files-found: ignore

  commitlint:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile
      - name: Lint PR commit messages
        run: >-
          cd frontend && pnpm exec commitlint --config ../.commitlintrc.json
          --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

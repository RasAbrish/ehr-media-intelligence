name: Summary eval

# Manual or nightly run of `make eval` with the real model. Needs the ANTHROPIC_API_KEY secret.
# The eval harness ships in Phase 3; until then this workflow only checks that it is wired.
on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: cd backend && uv sync --locked --extra dev
      - name: Run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Call the CLI directly: make turns every failure into exit code 2, which would hide
        # real eval failures. The CLI exits 3 only while the stage is not built yet.
        run: |
          set +e
          cd backend && uv run ehr-mip eval
          code=$?
          if [ "$code" -eq 3 ]; then echo "eval harness not built yet (Phase 3)"; exit 0; fi
          exit $code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-report
          path: reports/eval_report.*
          if-no-files-found: ignore

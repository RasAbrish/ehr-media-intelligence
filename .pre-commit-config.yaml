# Install with `make setup` (pre-commit and commit-msg hooks).
# Python and Node tools run from the project's locked toolchains (uv, pnpm) so hooks and CI agree.
default_install_hook_types: [pre-commit, commit-msg]
exclude: ^(data/raw/|frontend/src/components/ui/|backend/uv\.lock|frontend/pnpm-lock\.yaml)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: tsconfig.*\.json$ # JSONC (comments allowed)
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks # staged changes, on every commit
      # Full history scan, run by `make secrets` and CI (the hook above only sees staged changes).
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (git history)
        entry: gitleaks git --redact --verbose
        stages: [manual]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: bash -c 'cd backend && uv run mypy src ../scripts/generate_synthetic_data.py'
        language: system
        types: [python]
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: bash -c 'cd frontend && pnpm -s exec prettier --check .'
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && pnpm -s lint'
        language: system
        files: ^frontend/.*\.(ts|tsx|js)$
        pass_filenames: false
      - id: commitlint
        name: commitlint
        entry: bash -c 'msg="$(realpath "$1")" && cd frontend && pnpm -s exec commitlint --config ../.commitlintrc.json --edit "$msg"' --
        language: system
        stages: [commit-msg]
        always_run: true

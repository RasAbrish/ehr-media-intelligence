# Free public demo on Render (docs/DEPLOY.md): synthetic data only, no model key.
# Validated against https://render.com/schema/render.yaml.json
#
# If Render gives the API a different subdomain because the name is taken, change its name and
# the destination of the /api/* route below to match.
services:
  - type: web
    name: ehr-mi-api-7c41
    runtime: docker
    plan: free # never omit: the default plan is paid
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: "off" # no CI gates a push, so deploys are started by hand
    envVars:
      - key: PORT
        value: "8000"
      - key: LLM_PROVIDER
        value: extractive # a public URL must never reach a paid model
      - key: SQLITE_PATH
        value: /app/demo-data/ehr_mip.db
      - key: CHROMA_DIR
        value: /app/demo-data/chroma
      - key: CACHE_BACKEND
        value: memory
      # Swagger UI at /docs on the API URL. It describes the API only; data needs a sign-in.
      - key: API_DOCS_ENABLED
        value: "true"
      # Your own sign-in. Render asks for these once in the dashboard; they never enter git.
      - key: SEED_ACCOUNT_EMAIL
        sync: false
      - key: SEED_ACCOUNT_PASSWORD
        sync: false
      # 0.1 CPU and 512 MB
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: MALLOC_ARENA_MAX
        value: "2"

  - type: web
    name: ehr-mi-demo-7c41
    runtime: static
    autoDeployTrigger: "off"
    buildCommand: cd frontend && npx --yes pnpm@12.16.1 install --frozen-lockfile --prod=false && npx --yes pnpm@12.16.1 exec vite build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_DEMO_MODE
        value: "true"
    routes:
      # Order matters. Same origin, so the CSP stays connect-src 'self' and needs no CORS.
      - type: rewrite
        source: /api/*
        destination: https://ehr-mi-api-7c41.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "no-referrer"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: "same-origin"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"

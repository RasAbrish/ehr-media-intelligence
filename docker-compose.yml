# docker compose up                  -> http://localhost:8080 (no API key needed)
# docker compose --profile redis up  -> the same, with Redis for cache and rate limits
# Hardening: docs/09-SECURITY.md section 9.
name: ehr-mip

x-hardened: &hardened
  init: true
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 512

services:
  api:
    <<: *hardened
    image: ehr-mip-api:local
    pull_policy: build
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "10001:10001"
    # Paths, bootstrap and cache choice are fixed here, so a copied .env cannot break them.
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-5-5}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-500000}
      SEARCH_MODE: ${SEARCH_MODE:-hybrid}
      INDEX_OBSERVATIONS: ${INDEX_OBSERVATIONS:-false}
      FEEDBACK_ENABLED: ${FEEDBACK_ENABLED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEED_ACCOUNT_EMAIL: ${SEED_ACCOUNT_EMAIL:-}
      SEED_ACCOUNT_PASSWORD: ${SEED_ACCOUNT_PASSWORD:-}
      AUTO_BOOTSTRAP: "true"
      CACHE_BACKEND: auto
      REDIS_URL: redis://redis:6379/0
      FORWARDED_ALLOW_IPS: 172.30.89.2 # nginx only
    volumes: ["app-data:/app/data/generated"]
    depends_on:
      redis: { condition: service_healthy, required: false }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"
      interval: 15s
      timeout: 5s
      start_period: 600s # the first start runs the pipeline
      start_interval: 3s
    networks:
      app: { ipv4_address: 172.30.89.3 }

  web:
    <<: *hardened
    image: ehr-mip-web:local
    pull_policy: build
    build:
      context: frontend
    user: "101:101"
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
    networks:
      app: { ipv4_address: 172.30.89.2 }

  redis:
    <<: *hardened
    profiles: ["redis"]
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    user: "999:1000"
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    # No published port and no persistence: disposable cache and counters only.
    tmpfs: ["/tmp", "/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      start_interval: 1s
    networks:
      app: { ipv4_address: 172.30.89.4 }

networks:
  app:
    ipam:
      config: [{ subnet: 172.30.89.0/28 }]

volumes:
  app-data:

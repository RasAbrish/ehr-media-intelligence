# Replaces conf.d/default.conf of nginx-unprivileged (user 101, port 8080, temp files in /tmp).
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Queries travel in POST bodies, never in URLs (docs/09 API rules); the SPA keeps ?q= in
    # its own URL, so the query string is left out of the access log.
    access_log off;
    # Upstream errors are logged with the request line, so ?q=<name>: keep crit and worse only.
    error_log /dev/stderr crit;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the caller cannot choose its rate limit bucket.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s; # fail fast while the API restarts
        proxy_read_timeout 60s;
        client_max_body_size 1m; # the API itself answers 413 as problem+json above 16 KB
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
